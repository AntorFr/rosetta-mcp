[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosetta-mcp"
version = "0.8.0"
description = "Rosetta - a modular MCP hub: many thin MCP servers (addons) behind one HTTP endpoint and one OIDC auth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Capped below 2.0: the 2.x line moved `mcp.server.fastmcp`, which every addon
    # imports through _common. Lifting the cap means porting the addons first.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "pypdf>=5",
    # `withings` resolves bare dates in the local zone, and zoneinfo needs a tz
    # database - a slim base image is not guaranteed to ship one. Carry the
    # fallback rather than depend on the answer.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
