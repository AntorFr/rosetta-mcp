[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosetta-mcp"
version = "0.31.0"
description = "Rosetta - a modular MCP hub: many thin MCP servers (addons) behind one HTTP endpoint and one OIDC auth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Capped below 2.0: the 2.x line moved `mcp.server.fastmcp`, which every addon
    # imports through _common. Lifting the cap means porting the addons first.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "pypdf>=5",
    # `withings` resolves bare dates in the local zone, and zoneinfo needs a tz
    # database - a slim base image is not guaranteed to ship one. Carry the
    # fallback rather than depend on the answer.
    "tzdata>=2024.1",
    # `verbatim` resolves the subtitles a platform publishes. Deliberately NOT
    # pinned: a yt-dlp a few months old does not degrade, it stops — the site
    # changes its player and every older version fails on every video at once.
    # Rebuilding the image IS the maintenance, and a floor is the only bound
    # that makes sense here.
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# Longest line measured in src and tests: 178 characters (tests/test_filet_mutations.py).
line-length = 178

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S110", "S112", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Existing tests are not edited beyond import order/unused imports (no assertion touched):
# these style findings stay as written. Fixing them would rewrite test code.
"tests/test_meteo.py" = ["E731"]      # throwaway lambda helper in a fixture builder
"tests/test_trace.py" = ["B905"]      # zip() of two equal-length lists; strict= would be new behaviour in a test
"tests/test_verbatim.py" = ["E741"]   # short loop variable `l` in test comprehensions

[tool.coverage.run]
source = ["src/rosetta"]

[tool.coverage.report]
# Floor = measured total on the full suite (85.78%, 457 tests), rounded down, measured 2026-11-05.
# It follows the measure: raise it when coverage rises, never invent a target.
fail_under = 85
