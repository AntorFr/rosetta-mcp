[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosetta-mcp"
version = "0.2.4"
description = "Rosetta - a modular MCP hub: many thin MCP servers (addons) behind one HTTP endpoint and one OIDC auth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
