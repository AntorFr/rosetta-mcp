name: docker-publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  attestation:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check the tests-complets attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse "HEAD^{tree}")
          # the tagged commit, or a parent with the same tree (a merge commit
          # whose content is the attested head's)
          candidates="$head"
          for parent in $(git rev-list --parents -n 1 HEAD | cut -d' ' -f2-); do
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              candidates="$candidates $parent"
            fi
          done
          for sha in $candidates; do
            state=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "tests-complets")][0].state // ""')
            if [ "$state" = "success" ]; then
              echo "tests-complets attested on $sha"
              exit 0
            fi
          done
          echo "::error::no tests-complets attestation (success) on $head or on a parent with the same tree: run 'attester --publier' on this commit before tagging"
          exit 1

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: attestation
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch only on stable releases (vX.Y.Z without suffix);
          # -beta / -rc builds stay amd64-only for speed.
          platforms: >-
            ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
                && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
